version: 2

sources:
  - name: raw
    description: >
      Loaded by pipeline/load_raw.py with explicit schemas (pipeline/contracts.py). orders,
      order_items, order_payments and order_reviews are change feeds: the daily replay
      (pipeline/replay.py) appends one row per version of a record, tagged with its batch,
      the simulated date it is known at and the real load time. The staging models keep the
      latest version. The other tables are reference data, loaded whole.
    schema: "{{ var('raw_dataset', 'raw') }}"
    tables:
      - name: orders
        columns:
          - name: order_id
            data_tests: [not_null]
          - name: customer_id
            data_tests: [not_null]
          - name: _batch
            data_tests: [not_null]
      - name: customers
        columns:
          - name: customer_id
            data_tests: [unique, not_null]
      - name: order_items
        columns:
          - name: order_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'orders')
                    field: order_id
      - name: order_payments
        columns:
          - name: order_id
            data_tests: [not_null]
      - name: order_reviews
        columns:
          - name: review_score
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [1, 2, 3, 4, 5]
                    quote: false
      - name: products
        columns:
          - name: product_id
            data_tests: [unique, not_null]
      - name: sellers
        columns:
          - name: seller_id
            data_tests: [unique, not_null]
      - name: product_category_name_translation
        columns:
          - name: product_category_name
            data_tests: [unique, not_null]

  - name: ops
    description: Pipeline metadata written by the loader.
    schema: "{{ var('ops_dataset', 'ops') }}"
    tables:
      - name: load_audit
        description: >
          One row per table per load. Freshness reads the replay rows: a new batch lands every
          day, so no new batch for more than a day means the pipeline is late
          (.github/workflows/monitor.yml checks this every six hours).
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 26, period: hour}
            error_after: {count: 50, period: hour}
            filter: "action = 'replay'"

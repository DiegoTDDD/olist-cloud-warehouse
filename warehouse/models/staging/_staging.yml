version: 2

models:
  - name: stg_orders
    description: One row per order. Times are Brazilian local time (DATETIME, no zone).
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: category
        data_tests: [not_null]
  - name: stg_sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

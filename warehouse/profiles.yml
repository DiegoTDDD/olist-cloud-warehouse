# Credentials come from Application Default Credentials: in CI, the short-lived token that
# google-github-actions/auth obtains through Workload Identity Federation; locally, gcloud.
# There is no key file anywhere.
olist:
  target: "{{ env_var('DBT_TARGET', 'prod') }}"
  outputs:
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: staging
      location: southamerica-east1
      threads: 4
      priority: interactive
      job_execution_timeout_seconds: 300
      job_retries: 2
      # Cost guardrail: any single query that would bill more than 1 GB fails instead of running.
      maximum_bytes_billed: 1000000000
    ci:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: "{{ env_var('CI_DATASET_PREFIX', 'ci_local') }}"
      location: southamerica-east1
      threads: 4
      priority: interactive
      job_execution_timeout_seconds: 300
      job_retries: 2
      maximum_bytes_billed: 1000000000

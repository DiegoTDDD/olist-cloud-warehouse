name: oidc-claims
# Temporary: prints the non-secret claims of this repository's GitHub OIDC token (no signature),
# to check them against the Workload Identity Federation condition.
on:
  push:
    branches: [main]
    paths: [".github/workflows/oidc-claims.yml"]
permissions:
  id-token: write
  contents: read
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=probe" | jq -r .value)
          echo "$token" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, repository, repository_owner, repository_owner_id, repository_id, ref, event_name}' || true

name: monitor

# Every six hours, independently of the deploy: is the newest replay batch less than a day old?
# A deploy that never started (disabled schedule, GitHub outage) fails nothing by itself; this
# catches it. dbt source freshness warns after 26 hours and errors after 50 (warehouse/models/
# staging/_sources.yml); an error opens the pipeline-alert issue.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      DBT_TARGET: prod
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: dbt source freshness
        working-directory: warehouse
        run: dbt source freshness --select source:ops
      - name: Open an alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/alert.sh fail "Pipeline late: no new data for over 50 hours" \
            "Freshness check failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. What to do: docs/runbook.md."
